<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026-2027 UEFA Mev Fen League Sticker Album</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,Arial,sans-serif;background:#0a1a4a;background:radial-gradient(circle at top,#1b3a9c,#050d2b);color:#fff;min-height:100vh}
.screen{display:none;padding:16px;max-width:900px;margin:0 auto}
.screen.on{display:block}
h1{font-size:1.3rem;text-align:center;margin:8px 0}
.cover{text-align:center;padding-top:24px}
.cover .img{width:min(340px,85vw);aspect-ratio:3/4;margin:16px auto;border-radius:16px;border:6px solid #ffd700;box-shadow:0 0 30px #ffd70066;background:#13296b;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cover img{width:100%;height:100%;object-fit:cover}
.btn{background:linear-gradient(#ffd700,#e0a800);color:#0a1a4a;border:0;padding:12px 22px;font-size:1rem;font-weight:700;border-radius:30px;cursor:pointer;margin:6px}
.btn.alt{background:#2a46a8;color:#fff}
.bar{height:12px;background:#13296b;border-radius:8px;overflow:hidden;margin:8px 0}
.bar div{height:100%;background:#ffd700;width:0;transition:width .4s}
.top{text-align:center;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
@media(max-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
.slot{aspect-ratio:3/4;border-radius:10px;background:#13296b;border:2px dashed #4a64c4;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:#4a64c4;font-weight:800;cursor:default}
.slot.have{border:3px solid #ffd700;cursor:pointer;color:#fff}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .n{position:absolute;left:4px;top:4px;background:#0a1a4acc;border-radius:6px;font-size:.75rem;padding:1px 6px;z-index:2}
.slot .c{position:absolute;right:4px;bottom:4px;background:#e53935;border-radius:10px;font-size:.75rem;padding:1px 7px;z-index:2}
.pack{display:flex;gap:10px;justify-content:center;margin:20px 0;flex-wrap:wrap}
.card{width:30%;max-width:200px;aspect-ratio:3/4;perspective:800px;cursor:pointer}
.card .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;overflow:hidden;border:3px solid #ffd700;display:flex;align-items:center;justify-content:center}
.back{background:repeating-linear-gradient(45deg,#1b3a9c,#1b3a9c 10px,#13296b 10px,#13296b 20px);font-size:2.5rem}
.front{transform:rotateY(180deg);background:#13296b;font-size:2.5rem;font-weight:800}
.front img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.front .n{position:absolute;left:5px;top:5px;background:#0a1a4acc;border-radius:6px;font-size:.8rem;padding:1px 6px;z-index:2}
.tag{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:.8rem;font-weight:700;z-index:2}
.tag span{background:#e53935;padding:2px 8px;border-radius:10px}.tag .new{background:#2e7d32}
#modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9}
#modal.on{display:flex}
#modal .slot{width:min(320px,80vw);font-size:4rem}
.win{text-align:center;background:#ffd70022;border:2px solid #ffd700;border-radius:12px;padding:10px;margin:10px 0;display:none}
</style>
</head>
<body>

<div id="cover" class="screen on cover">
  <h1>⚽ 2026-2027</h1>
  <h1 style="font-size:1.6rem;color:#ffd700">UEFA Mev Fen League<br>Sticker Album</h1>
  <div class="img" id="coverImg"></div>
  <button class="btn" onclick="show('album')">Albümü Aç</button>
</div>

<div id="album" class="screen">
  <h1>📒 Sticker Albümüm</h1>
  <div class="top"><b id="cnt">0</b> / 20 sticker</div>
  <div class="bar"><div id="prog"></div></div>
  <div class="win" id="win">🏆 Tebrikler! Albümü tamamladın!</div>
  <div class="grid" id="grid"></div>
  <div style="text-align:center">
    <button class="btn" onclick="openPack()">🎁 Paket Aç (3 sticker)</button>
    <button class="btn alt" onclick="show('cover')">Kapak</button>
    <button class="btn alt" onclick="resetAll()">Sıfırla</button>
  </div>
</div>

<div id="pack" class="screen">
  <h1>🎁 Paketin açıldı!</h1>
  <div class="top">Kartlara dokunarak çevir</div>
  <div class="pack" id="packCards"></div>
  <div style="text-align:center">
    <button class="btn" onclick="openPack()">🎁 Bir Paket Daha</button>
    <button class="btn alt" onclick="show('album')">Albüme Dön</button>
  </div>
</div>

<div id="modal" onclick="this.classList.remove('on')"><div id="modalSlot"></div></div>

<script>
const TOTAL=20, EXT=['jpeg','jpg','png','webp','JPG','JPEG','PNG'];
let own=JSON.parse(localStorage.getItem('mevfen_album')||'{}');

// Fotoğrafı uzantı sırasıyla dener; hiçbiri yoksa numara görünür
function img(name){
  const i=document.createElement('img');let k=0;
  const base=name.map?name:[name];
  let b=0;
  const next=()=>{
    if(k>=EXT.length){b++;k=0;}
    if(b>=base.length){i.remove();return;}
    i.src=encodeURIComponent(base[b])+'.'+EXT[k++];
  };
  i.onerror=next;next();return i;
}
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
  if(id==='album')render();window.scrollTo(0,0);
}
function save(){localStorage.setItem('mevfen_album',JSON.stringify(own))}
function render(){
  const g=document.getElementById('grid');g.innerHTML='';
  let have=0;
  for(let n=1;n<=TOTAL;n++){
    const s=document.createElement('div');s.className='slot';
    if(own[n]){
      have++;s.classList.add('have');
      s.appendChild(img(String(n)));
      s.insertAdjacentHTML('beforeend','<span class="n">#'+n+'</span>'+(own[n]>1?'<span class="c">x'+own[n]+'</span>':''));
      s.onclick=()=>zoom(n);
    }else s.textContent=n;
    g.appendChild(s);
  }
  cnt.textContent=have;prog.style.width=(have/TOTAL*100)+'%';
  win.style.display=have===TOTAL?'block':'none';
}
function zoom(n){
  const s=document.createElement('div');s.className='slot have';
  s.appendChild(img(String(n)));s.insertAdjacentHTML('beforeend','<span class="n">#'+n+'</span>');
  modalSlot.innerHTML='';modalSlot.appendChild(s);modal.classList.add('on');
}
function openPack(){
  const c=document.getElementById('packCards');c.innerHTML='';
  for(let j=0;j<3;j++){
    const n=1+Math.floor(Math.random()*TOTAL);
    const isNew=!own[n];own[n]=(own[n]||0)+1;
    const d=document.createElement('div');d.className='card';
    d.innerHTML='<div class="in"><div class="face back">⚽</div><div class="face front">'+n+'<span class="n">#'+n+'</span><div class="tag"><span class="'+(isNew?'new':'')+'">'+(isNew?'YENİ!':'Tekrar')+'</span></div></div></div>';
    d.querySelector('.front').prepend(img(String(n)));
    d.onclick=()=>d.classList.add('flip');
    c.appendChild(d);
  }
  save();show('pack');
}
function resetAll(){if(confirm('Tüm stickerlar silinsin mi?')){own={};save();render()}}

// Kapak fotoğrafı: baş.*
coverImg.appendChild(img(['baş','bas']));
render();
</script>
</body>
</html>
